  <style>
    :root {
      --primary: #123048;
      --primary-light: #1c4568;
      --primary-dark: #0a1c2a;
      --accent: #d4a359;
      --accent-hover: #b8863b;
      --surface: #ffffff;
      --bg-alt: #f4f7f9;
      --text: #212529;
      --text-muted: #5f6c7b;
      --border: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 24px;
      --shadow-sm: 0 4px 12px rgba(18, 48, 72, 0.06);
      --shadow-md: 0 12px 28px rgba(18, 48, 72, 0.1);
      --shadow-lg: 0 20px 40px rgba(18, 48, 72, 0.14);
      --container: 1200px;
      --transition: all 0.28s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      color: var(--text);
      background-color: #ffffff;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.25;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Gombok */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 14px 28px;
      border-radius: 50px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-accent {
      background-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(212, 163, 89, 0.35);
    }
